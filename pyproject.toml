[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lassqd"
version = "0.1.0"
description = "Sample-based quantum diagonalization as a fragment solver for LASSCF"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# See docs/installation.md for the staged build prerequisites.
dependencies = [
    "numpy>=1.25",
    # mrh's LinearOperator subclasses are incompatible with SciPy 1.18.
    "scipy<1.18",
    "h5py",
    "pyscf==2.14.0",
    "pyscf-forge @ git+https://github.com/pyscf/pyscf-forge.git@f55abdb2806697c4132c416a43ddebadf93e3b1a",
    # Supplied by the editable Git installation in docs/installation.md (commit f0077658).
    "mrh==0.1.dev5906+gf00776583",
    "qiskit",
    # 0.13.1 includes SQD's MPI collective support.
    "qiskit-addon-sqd>=0.13.1",
]

[project.optional-dependencies]
# Local circuit simulation, as in the tutorial and examples.
sim = ["ffsim", "qiskit-aer"]
ibm = ["qiskit-ibm-runtime"]

[project.urls]
Documentation = "https://joannaqw.github.io/lassqd_code/"
Repository = "https://github.com/joannaqw/lassqd_code"

[tool.setuptools]
packages = ["lassqd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ffsim",
    "fulqrum>=0.4.5",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "qiskit-aer",
    "ruff>=0.16.9",
]
# Sphinx and the runtime dependencies autodoc imports. docs/conf.py mocks mrh,
# so this group installs without the native builds or the project itself.
docs = [
    "myst-nb",
    "qiskit-sphinx-theme",
    "sphinx",
    "numpy>=1.25",
    "scipy<1.18",
    "h5py",
    "pyscf==2.14.0",
    "qiskit",
    "qiskit-addon-sqd>=0.13.1",
]

[tool.uv.sources]
# Keep the checkout outside .venv so uv can create/recreate the environment.
mrh = { path = ".deps/mrh", editable = true }

[tool.uv.extra-build-dependencies]
# Supply the upstream build requirements in isolated environments. Use the
# same PySCF version as the runtime dependency for both native builds.
mrh = ["wheel", "cmake>=3.19,<4", "pyscf==2.14.0"]
pyscf-forge = ["cmake>=3.19,<4", "pyscf==2.14.0"]
